<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İngilizce Söyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<!--
    Hayvanı İngilizce Söyle (demo)
    Çocuğa bir hayvan resmi gösterilir, Türkçe "Bu hayvanın İngilizcesi ne?" diye sorulur,
    mikrofondan cevap dinlenir (Web Speech API, en-US) ve doğruysa kutlanır.

    - Resimler: ../karsiya-gecirme/assets/images/ (kopyalanmadı)
    - Sesler: assets/speech/tr|en/*.mp3, ElevenLabs ile üretildi (generate_speech.py; anahtar ../want-to/.env).
      Dosya çalınamazsa tarayıcının konuşma sentezi yedek olarak kullanılır.
      Yeni hayvan eklerken: ANIMALS'a ve generate_speech.py içindeki EN_WORDS'e ekle, betiği çalıştır.
    - Konuşma tanıma Chrome/Edge/Safari'de çalışır, Firefox'ta çalışmaz; HTTPS veya localhost gerekir.
      Chrome'da ses tanıma için Google sunucularına gönderilir.
    - Sorular: ?animals=2&colors=2&objects=1 (varsayılan da bu). Portal ayrıca embed=1 ile açar.
    - ?mod=tam: solda oyunlaştırılmış skor tablosu (çıkartma albümü, seviye, toplam yıldız);
      geniş ekranda sağda Three.js koşu oyunu (runner.js): doğru cevapta engel gelir, koyun atlar.
    - Türkçe yardım: ilk denemede bilemezse Türkçesi istenir (tr-TR dinlenir); bilirse kaydedilir ve
      "Tamam! Türkçesi kedi, İngilizcesi de cat. Hadi şimdi sen de söyle!" diye İngilizceye yönlendirilir.
    - İlerleme localStorage'da (ingilizce-soyle-ilerleme-v1): Leitner kutuları, soru seçimi buna göre.
    - Bitince portal için: postMessage({ status: 'success', score, total }); konuşma tanıma yoksa
      veya mikrofon izni verilmezse (embed=1'de) postMessage({ status: 'skipped', reason }).
    - Nesne resimleri: assets/images/objects/ — Microsoft Fluent Emoji 3D (MIT, LICENSE.txt)
-->
<style>
    :root {
        --bg: #FFF5F8;
        --ink: #3B2F4A;
        --muted: #6E6280;
        --rose: #FF8FB1;
        --rose-deep: #F2648F;
        --lilac: #B9A4FF;
        --mint: #7FD8B0;
        --butter: #FFD966;
        --shadow: rgba(232, 120, 160, .25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: radial-gradient(circle at 50% 0%, #FFE3EC 0%, var(--bg) 55%);
        color: var(--ink); font-family: 'Nunito', system-ui, sans-serif;
        display: flex; flex-direction: column; align-items: center; overflow: hidden;
        -webkit-tap-highlight-color: transparent; user-select: none;
    }

    .stars { display: flex; gap: 6px; padding: 16px 16px 0; }
    .stars svg { width: 40px; height: 40px; transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
    .stars svg.on { transform: scale(1.15); }

    .stage { flex: 1; width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 12px 16px 24px; }

    .card {
        position: relative; width: min(78vw, 46vh, 380px); aspect-ratio: 1; border-radius: 40px; background: #FFFFFF;
        box-shadow: 0 12px 34px var(--shadow); display: flex; align-items: center; justify-content: center;
    }
    .card img { width: 82%; height: 82%; object-fit: contain; animation: bob 3s ease-in-out infinite; }
    .card .blob {
        width: 74%; height: 74%; border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%;
        background: var(--blob); box-shadow: inset -18px -22px 0 rgba(0, 0, 0, .12), inset 16px 18px 0 rgba(255, 255, 255, .35);
        animation: bob 3s ease-in-out infinite, morph 6s ease-in-out infinite;
    }
    .card .blob[hidden], .card img[hidden] { display: none; }
    .card.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
    .card.shake { animation: shake .5s ease-in-out; }
    .card .answer {
        position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%) scale(.6); opacity: 0;
        background: var(--mint); color: #FFFFFF; font: 700 34px 'Fredoka', sans-serif; padding: 6px 26px; border-radius: 999px;
        box-shadow: 0 6px 16px rgba(60, 160, 120, .3); transition: transform .4s cubic-bezier(.3, 1.6, .5, 1), opacity .25s; white-space: nowrap;
    }
    .card .answer.show { opacity: 1; transform: translateX(-50%) scale(1); }
    .check {
        position: absolute; top: -14px; right: -14px; width: 74px; height: 74px; border-radius: 50%; background: var(--mint);
        display: flex; align-items: center; justify-content: center; border: 5px solid #FFFFFF; transform: scale(0); transition: transform .4s cubic-bezier(.3, 1.6, .5, 1);
    }
    .check.show { transform: scale(1); }

    .controls { display: flex; align-items: center; gap: 22px; }
    .mic {
        position: relative; width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
        background: linear-gradient(160deg, var(--rose), var(--rose-deep)); box-shadow: 0 10px 26px var(--shadow);
        display: flex; align-items: center; justify-content: center; transition: transform .2s;
    }
    .mic:active { transform: scale(.94); }
    .mic svg { width: 50px; height: 50px; position: relative; z-index: 1; }
    .mic .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--rose); opacity: 0; }
    .mic.listening .ring { animation: ring 1.6s ease-out infinite; }
    .mic.listening .ring:nth-child(2) { animation-delay: .53s; }
    .mic.listening .ring:nth-child(3) { animation-delay: 1.06s; }
    .mic.busy { filter: saturate(.4); }
    .ear {
        width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; background: #FFFFFF;
        box-shadow: 0 6px 18px var(--shadow); display: flex; align-items: center; justify-content: center;
    }
    .ear svg { width: 34px; height: 34px; }
    button:focus-visible { outline: 4px solid var(--lilac); outline-offset: 4px; }

    .heard { min-height: 20px; font-size: 13px; color: var(--muted); text-align: center; }

    .overlay {
        position: fixed; inset: 0; background: rgba(255, 245, 248, .96); display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; z-index: 10;
    }
    .overlay[hidden] { display: none; }
    .play {
        width: 150px; height: 150px; border-radius: 50%; border: 0; cursor: pointer;
        background: linear-gradient(160deg, var(--rose), var(--rose-deep)); box-shadow: 0 14px 34px var(--shadow);
        display: flex; align-items: center; justify-content: center; animation: breathe 2.2s ease-in-out infinite;
    }
    .play svg { width: 64px; height: 64px; margin-left: 8px; }
    .peek { display: flex; gap: 10px; }
    .peek img { width: 64px; height: 64px; object-fit: contain; animation: bob 2.6s ease-in-out infinite; }
    .peek img:nth-child(2) { animation-delay: .3s; } .peek img:nth-child(3) { animation-delay: .6s; }
    .note { max-width: 420px; font-size: 14px; color: var(--muted); line-height: 1.5; }
    .note strong { color: var(--ink); }
    .big-stars { display: flex; gap: 8px; }
    .big-stars svg { width: 58px; height: 58px; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) both; }

    .confetti { position: fixed; width: 12px; height: 16px; border-radius: 3px; pointer-events: none; z-index: 20; animation: confetti 1.4s cubic-bezier(.2, .7, .4, 1) forwards; }

    @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes morph { 0%, 100% { border-radius: 58% 42% 55% 45% / 48% 56% 44% 52% } 50% { border-radius: 45% 55% 42% 58% / 55% 45% 56% 44% } }
    @keyframes pop { 0% { transform: scale(.7) } 60% { transform: scale(1.08) } 100% { transform: scale(1) } }
    @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-12px) rotate(-3deg) } 40% { transform: translateX(10px) rotate(2deg) } 60% { transform: translateX(-6px) } 80% { transform: translateX(4px) } }
    @keyframes ring { from { transform: scale(1); opacity: .8 } to { transform: scale(1.8); opacity: 0 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes confetti { from { transform: translate(0, 0) rotate(0); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0 } }

    /* ---------- ?mod=tam: solda skor tablosu ---------- */
    .play-col { flex: 1; min-width: 0; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .board[hidden] { display: none; }
    body.mode-tam { flex-direction: row; align-items: stretch; }
    body.mode-tam .overlay { left: 340px; }
    .board {
        width: 340px; flex: none; height: 100%; overflow-y: auto; background: #FFFFFF; border-radius: 0 34px 34px 0;
        box-shadow: 6px 0 24px var(--shadow); padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px;
    }
    .board__top { display: flex; align-items: center; gap: 12px; }
    .trophy { width: 64px; height: 64px; flex: none; border-radius: 22px; background: linear-gradient(160deg, #FFE7A3, #FFC94D); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(240, 169, 46, .35); }
    .trophy svg { width: 38px; height: 38px; }
    .total { font: 700 36px/1 'Fredoka', sans-serif; display: flex; align-items: center; gap: 6px; }
    .total svg { width: 30px; height: 30px; }
    .lvl { display: flex; flex-direction: column; gap: 6px; }
    .lvl__row { display: flex; align-items: center; justify-content: space-between; font: 600 15px 'Fredoka', sans-serif; color: var(--muted); }
    .lvl__badge { background: var(--lilac); color: #FFFFFF; border-radius: 999px; padding: 3px 12px; font-size: 15px; }
    .segs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .segs span { height: 12px; border-radius: 999px; background: #F3E9F7; }
    .segs span.on { background: linear-gradient(90deg, #B9A4FF, #FF8FB1); }
    .cat { display: flex; flex-direction: column; gap: 8px; }
    .cat__head { display: flex; align-items: center; gap: 8px; font: 600 14px 'Fredoka', sans-serif; color: var(--muted); }
    .cat__icon { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
    .cat__icon svg { width: 18px; height: 18px; }
    .cat__bar { flex: 1; height: 8px; border-radius: 999px; background: #F3E9F7; overflow: hidden; }
    .cat__bar i { display: block; height: 100%; border-radius: 999px; background: var(--mint); transition: width .5s; }
    .album { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .tile { position: relative; aspect-ratio: 1; border-radius: 14px; background: #FFF5F8; display: flex; align-items: center; justify-content: center; transition: transform .3s; }
    .tile img { width: 82%; height: 82%; object-fit: contain; }
    .tile .dot { width: 64%; height: 64%; border-radius: 50%; }
    .tile--new img, .tile--new .dot { filter: grayscale(1) brightness(1.15); opacity: .28; }
    .tile--new::after { content: '?'; position: absolute; font: 700 18px 'Fredoka', sans-serif; color: #D9C9E6; }
    .tile--seen img, .tile--seen .dot { opacity: .65; }
    .tile--learned { background: #FFF6DA; box-shadow: inset 0 0 0 2px #FFD966; }
    .tile--now { box-shadow: inset 0 0 0 3px var(--rose); animation: breathe 1.6s ease-in-out infinite; }
    .tile .mini { position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); display: flex; }
    .tile .mini svg { width: 9px; height: 9px; }
    .tile .tr { position: absolute; top: -4px; right: -4px; font: 700 9px/1 'Nunito', sans-serif; color: #FFFFFF; background: #E5484D; border-radius: 6px; padding: 2px 3px; }
    /* Sağ panel: koşu oyunu (sadece geniş ekranda) */
    .runner { display: none; }
    @media (min-width: 1100px) {
        body.mode-tam .runner {
            display: block; position: relative; width: 360px; flex: none; height: 100%;
            border-radius: 34px 0 0 34px; overflow: hidden; box-shadow: -6px 0 24px var(--shadow); background: #CDEAFF;
        }
        body.mode-tam .overlay { right: 360px; }
    }
    .runner-hud {
        position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
        background: #FFFFFF; border-radius: 999px; padding: 6px 16px 6px 10px; box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
        font: 700 26px/1 'Fredoka', sans-serif; color: var(--ink);
    }
    .runner-hud svg { width: 30px; height: 30px; }
    .runner-hud.bump { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }

    @media (max-width: 760px) {
        body.mode-tam { flex-direction: column; }
        body.mode-tam .overlay { left: 0; top: 36vh; }
        .board { width: 100%; height: auto; max-height: 36vh; border-radius: 0 0 28px 28px; box-shadow: 0 6px 24px var(--shadow); }
        .album { grid-template-columns: repeat(10, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<aside class="board" id="board" aria-label="İlerleme" hidden></aside>

<div class="play-col">
<div class="stars" id="stars" aria-label="Yıldızlar"></div>

<main class="stage">
    <div class="card" id="card">
        <img id="animal" alt="">
        <div class="blob" id="blob" hidden></div>
        <div class="check" id="check" aria-hidden="true">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <div class="answer" id="answer"></div>
    </div>

    <div class="controls">
        <button class="ear" id="ear" type="button" aria-label="Kelimeyi dinle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#F2648F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button class="mic" id="mic" type="button" aria-label="Söyle">
            <span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
    </div>

    <div class="heard" id="heard" aria-live="polite"></div>
</main>
</div>

<aside class="runner" id="runner" aria-label="Koşan koyun"></aside>

<!-- Başlangıç -->
<div class="overlay" id="start">
    <div class="peek">
        <img src="../karsiya-gecirme/assets/images/cat.png" alt="">
        <img src="../karsiya-gecirme/assets/images/lion.png" alt="">
        <img src="../karsiya-gecirme/assets/images/frog.png" alt="">
    </div>
    <button class="play" id="play" type="button" aria-label="Oyunu başlat">
        <svg viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
    <p class="note" id="unsupported" hidden>
        <strong>Bu tarayıcı konuşma tanımayı desteklemiyor.</strong><br>
        Oyunu Chrome, Edge ya da Safari'de açın. Sayfa HTTPS veya localhost üzerinden açılmalı.
    </p>
</div>

<!-- Bitiş -->
<div class="overlay" id="finish" hidden>
    <div class="big-stars" id="bigStars"></div>
    <button class="play" id="again" type="button" aria-label="Tekrar oyna">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="margin-left:0"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
</div>

<script>
(() => {
    /* ---------- Ayarlar ---------- */
    const IMG = '../karsiya-gecirme/assets/images/';
    const OBJ_IMG = 'assets/images/objects/'; // Microsoft Fluent Emoji 3D (MIT, LICENSE.txt)
    const MAX_TRIES = 3;

    // Soru sayıları adresten okunur: ?animals=2&colors=2&objects=1 (portal böyle açar).
    // embed=1: portalın oyun penceresinde çalışıyor; tekrar oyna yok, desteklenmiyorsa hemen atlanır.
    const params = new URLSearchParams(location.search);
    const count = (key, def) => Math.max(0, Math.min(10, parseInt(params.get(key) ?? def, 10) || 0));
    const PLAN = { animal: count('animals', 2), color: count('colors', 2), object: count('objects', 1) };
    const EMBED = params.get('embed') === '1';
    const MODE_TAM = params.get('mod') === 'tam'; // solda skor tablosu, sağda koşu oyunu
    let runner = null; // runner.js (sağ panel), sadece tam modda ve geniş ekranda
    let ROUNDS = 5;

    // Portala haber ver (video sayfası mesajı alınca pencereyi kapatıp çizgi filme devam eder)
    const notifyParent = (payload) => {
        if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
    };

    // word: beklenen kelime; also: çocukların sık söylediği / tanıyıcının sık yazdığı kabul edilebilir biçimler
    const ANIMALS = [
        { word: 'cat',       img: 'cat.png',       also: ['kitty', 'kitten', 'cats', 'kat'] },
        { word: 'dog',       img: 'dog.png',       also: ['doggy', 'doggie', 'dogs', 'puppy'] },
        { word: 'cow',       img: 'cow.png',       also: ['cows'] },
        { word: 'sheep',     img: 'sheep.png',     also: ['ship', 'lamb'] },
        { word: 'horse',     img: 'horse.png',     also: ['horses', 'horsey', 'pony'] },
        { word: 'lion',      img: 'lion.png',      also: ['lions', 'lyon'] },
        { word: 'elephant',  img: 'elephant.png',  also: ['elephants'] },
        { word: 'monkey',    img: 'monkey.png',    also: ['monkeys'] },
        { word: 'frog',      img: 'frog.png',      also: ['frogs', 'froggy'] },
        { word: 'chicken',   img: 'chicken.png',   also: ['hen', 'chick'] },
        { word: 'rabbit',    img: 'rabbit.png',    also: ['bunny', 'rabbits'] },
        { word: 'bird',      img: 'bird.png',      also: ['birdie', 'birds'] },
        { word: 'bee',       img: 'bee.png',       also: ['bees', 'b', 'be'] },
        { word: 'giraffe',   img: 'giraffe.png',   also: ['giraffes'] },
        { word: 'whale',     img: 'whale.png',     also: ['whales', 'wale'] },
        { word: 'bear',      img: 'bear.gif',      also: ['bears', 'bare', 'teddy'] },
        { word: 'donkey',    img: 'donkey.png',    also: ['donkeys'] },
        { word: 'camel',     img: 'camel.png',     also: ['camels'] },
        { word: 'crocodile', img: 'crocodile.png', also: ['croc', 'alligator'] },
        { word: 'squirrel',  img: 'squirrel.png',  also: ['squirrels'] },
    ].map((a) => ({ ...a, type: 'animal', src: IMG + a.img }));

    const COLORS = [
        { word: 'red',    hex: '#FF4D4D', also: ['read', 'rad', 'redd', 'ret'] },
        { word: 'blue',   hex: '#3D8BFF', also: ['blew', 'bloo', 'blues'] },
        { word: 'green',  hex: '#3CC46B', also: ['greene', 'grin', 'greens'] },
        { word: 'yellow', hex: '#FFD12E', also: ['yello', 'jello'] },
        { word: 'pink',   hex: '#FF7EB9', also: ['ping', 'pinky', 'pinc'] },
        { word: 'purple', hex: '#9B5CF6', also: ['purpel', 'purples'] },
        { word: 'orange', hex: '#FF9233', also: ['oranges'] },
    ].map((c) => ({ ...c, type: 'color' }));

    const OBJECTS = [
        { word: 'apple',   also: ['apples'] },
        { word: 'ball',    also: ['balls', 'bowl', 'football'] },
        { word: 'car',     also: ['cars', 'automobile'] },
        { word: 'star',    also: ['stars'] },
        { word: 'sun',     also: ['son', 'sunny', 'sunshine'] },
        { word: 'house',   also: ['home', 'houses'] },
        { word: 'flower',  also: ['flowers', 'tulip', 'flour'] },
        { word: 'book',    also: ['books'] },
        { word: 'cake',    also: ['cakes'] },
        { word: 'balloon', also: ['balloons', 'baloon'] },
        { word: 'banana',  also: ['bananas'] },
        { word: 'moon',    also: ['moons'] },
    ].map((o) => ({ ...o, type: 'object', src: `${OBJ_IMG}${o.word}.png` }));

    const PROMPT = { animal: 'soru', color: 'renk-soru', object: 'nesne-soru' };

    // Türkçe karşılıklar: ilki seslendirilen ad (tr/words/<ingilizce>.mp3), diğerleri de kabul edilir
    const TR = {
        cat: ['kedi', 'kedicik', 'pisi', 'pisicik'], dog: ['köpek', 'köpekçik', 'kuçu'], cow: ['inek'],
        sheep: ['koyun', 'kuzu'], horse: ['at', 'atçık'], lion: ['aslan'], elephant: ['fil'], monkey: ['maymun'],
        frog: ['kurbağa'], chicken: ['tavuk', 'civciv'], rabbit: ['tavşan'], bird: ['kuş', 'kuşçuk', 'serçe'],
        bee: ['arı'], giraffe: ['zürafa', 'zürefa'], whale: ['balina'], bear: ['ayı', 'ayıcık'], donkey: ['eşek'],
        camel: ['deve'], crocodile: ['timsah'], squirrel: ['sincap'],
        red: ['kırmızı'], blue: ['mavi'], green: ['yeşil'], yellow: ['sarı'], pink: ['pembe'], purple: ['mor'],
        orange: ['turuncu'],
        apple: ['elma'], ball: ['top'], car: ['araba'], star: ['yıldız'], sun: ['güneş'], house: ['ev'],
        flower: ['çiçek', 'lale'], book: ['kitap'], cake: ['pasta', 'kek'], balloon: ['balon'], banana: ['muz'],
        moon: ['ay', 'hilal'],
    };
    [...ANIMALS, ...COLORS, ...OBJECTS].forEach((q) => { q.tr = (TR[q.word] || [''])[0]; q.trAll = TR[q.word] || []; });

    /* ---------- İlerleme kaydı (Leitner kutuları) ----------
     * Rastgele değil: her kelimenin geçmişi tarayıcıda (localStorage) tutulur.
     *  - Hiç sorulmamış kelimeler önce gelir.
     *  - İlk denemede bilinen kelime bir üst kutuya çıkar ve daha seyrek sorulur.
     *  - Bilinemeyen kelime 1. kutuya döner, bir sonraki oyunda tekrar sorulur.
     * Aralıklar gün değil oyun sayısıdır (çocuk günde birkaç kez oynuyor).
     * Not: kayıt cihaza/tarayıcıya bağlıdır, kullanıcı hesabına değil.
     */
    const STORE_KEY = 'ingilizce-soyle-ilerleme-v1';
    const BOX_GAP = { 1: 0, 2: 1, 3: 3, 4: 6, 5: 10 }; // kutu → kaç oyun sonra tekrar
    const loadProgress = () => {
        try {
            const data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
            if (data && data.items) return data;
        } catch (e) { /* bozuk ya da erişilemiyor: sıfırdan başla */ }
        return { game: 0, items: {} };
    };
    const saveProgress = () => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* özel pencere vb. */ }
    };
    let progress = loadProgress();
    const keyOf = (q) => `${q.type}:${q.word}`;

    // Bir kategoriden n soru seç: önce hiç görülmemişler, sonra sırası gelmişler (düşük kutu, en eski önce)
    const choose = (list, n) => {
        const game = progress.game;
        const ranked = list.map((q) => {
            const st = progress.items[keyOf(q)];
            if (!st) return { q, rank: [0, 0, 0, Math.random()] };
            const due = st.last + BOX_GAP[st.box] < game ? 0 : 1; // 0: sırası geldi
            return { q, rank: [1 + due, st.box, st.last, Math.random()] };
        });
        ranked.sort((a, b) => {
            for (let i = 0; i < a.rank.length; i++) if (a.rank[i] !== b.rank[i]) return a.rank[i] - b.rank[i];
            return 0;
        });
        return ranked.slice(0, n).map((r) => r.q);
    };

    // Sonucu kaydet: firstTry → kutu atlar; sonradan bilirse kutu aynı kalır; bilemezse 1. kutuya döner
    const stateOf = (q) => progress.items[keyOf(q)] || { box: 1, seen: 0, right: 0, wrong: 0, tr: 0, last: progress.game };
    const record = (q, outcome) => {
        const k = keyOf(q);
        const st = stateOf(q);
        st.seen++;
        st.last = progress.game;
        if (outcome === 'firstTry') { st.right++; st.box = Math.min(5, st.box + 1); }
        else if (outcome === 'later') { st.right++; }
        else { st.wrong++; st.box = 1; }
        progress.items[k] = st;
        saveProgress();
        renderBoard();
    };
    // Çocuk Türkçesini söyledi: kaydet (skor tablosunda "TR" rozeti)
    const recordDunno = (q) => {
        const st = stateOf(q);
        st.dunno = (st.dunno || 0) + 1;
        progress.items[keyOf(q)] = st;
        saveProgress();
    };
    const recordTr = (q) => {
        const st = stateOf(q);
        st.tr = (st.tr || 0) + 1;
        progress.items[keyOf(q)] = st;
        saveProgress();
        renderBoard();
    };

    /* ---------- Skor tablosu (?mod=tam) ----------
     * Çıkartma albümü: öğrenilen (kutu ≥ 3) renkli + mini yıldızlar, görülmüş soluk, hiç görülmemiş gri "?".
     * Türkçesini söylediği ama İngilizcesi henüz öğrenilmemiş kelimelerde "TR" rozeti.
     * Seviye: her 5 öğrenilen kelimede bir.
     */
    const STAR_PATH = '<path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/>';
    const CATS = [
        { key: 'animal', label: 'Hayvanlar', bg: '#FFE3D3', color: '#FF9A62', icon: '<circle cx="6" cy="10" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="14" cy="5.5" r="2"/><circle cx="18" cy="10" r="2"/><path d="M8 18c0-3 2-6 4-6s4 3 4 6c0 2-2 2-4 1.5C10 20 8 20 8 18z"/>' },
        { key: 'color', label: 'Renkler', bg: '#E8DDFF', color: '#9B5CF6', icon: '<circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="9.5" r="1.4"/><circle cx="12.5" cy="7.5" r="1.4"/><circle cx="16" cy="10.5" r="1.4"/>' },
        { key: 'object', label: 'Nesneler', bg: '#DCEEFF', color: '#3D8BFF', icon: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>' },
    ];
    const LIST = { animal: ANIMALS, color: COLORS, object: OBJECTS };
    const isLearned = (st) => !!st && st.box >= 3;

    function renderBoard() {
        if (!MODE_TAM) return;
        const board = $('board');
        const all = [...ANIMALS, ...COLORS, ...OBJECTS];
        const states = all.map((q) => progress.items[keyOf(q)]);
        const learned = states.filter(isLearned).length;
        const totalStars = states.reduce((n, st) => n + (st ? st.right : 0), 0);
        const level = Math.floor(learned / 5) + 1;
        const segs = learned % 5;
        const now = current();

        const tile = (q) => {
            const st = progress.items[keyOf(q)];
            const cls = !st ? 'tile--new' : isLearned(st) ? 'tile--learned' : 'tile--seen';
            const nowCls = now && $('start').hidden && keyOf(now) === keyOf(q) ? ' tile--now' : ''; // şu an sorulan
            const pic = q.type === 'color'
                ? `<span class="dot" style="background:${q.hex}"></span>`
                : `<img src="${q.src}" alt="" loading="lazy">`;
            const stars = st ? Math.max(0, st.box - 1) : 0;
            const mini = stars ? `<span class="mini">${Array.from({ length: stars }, () => `<svg viewBox="0 0 24 24" fill="#FFC94D" stroke="#F0A92E" stroke-width="2">${STAR_PATH}</svg>`).join('')}</span>` : '';
            const tr = st && st.tr && !isLearned(st) ? '<span class="tr">TR</span>' : '';
            return `<div class="tile ${cls}${nowCls}" title="${q.word} · ${q.tr}">${pic}${mini}${tr}</div>`;
        };

        board.innerHTML = `
            <div class="board__top">
                <div class="trophy"><svg viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 3h10v3a5 5 0 0 1-10 0z"/><path d="M5 5H3a3 3 0 0 0 4 4M19 5h2a3 3 0 0 1-4 4" stroke="#FFFFFF" stroke-width="1.8" fill="none"/><path d="M10 12h4l-.5 4h-3zM8 18h8v3H8z"/></svg></div>
                <div class="total" aria-label="Toplam yıldız">${totalStars}<svg viewBox="0 0 24 24" fill="#FFD966" stroke="#F0A92E" stroke-width="1.6" stroke-linejoin="round">${STAR_PATH}</svg></div>
            </div>
            <div class="lvl">
                <div class="lvl__row"><span class="lvl__badge">Seviye ${level}</span><span>${learned} / ${all.length}</span></div>
                <div class="segs">${Array.from({ length: 5 }, (_, i) => `<span class="${i < segs ? 'on' : ''}"></span>`).join('')}</div>
            </div>
            ${CATS.map((c) => {
                const list = LIST[c.key];
                const done = list.filter((q) => isLearned(progress.items[keyOf(q)])).length;
                return `<section class="cat" aria-label="${c.label}">
                    <div class="cat__head">
                        <span class="cat__icon" style="background:${c.bg}"><svg viewBox="0 0 24 24" fill="none" stroke="${c.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></span>
                        <span class="cat__bar"><i style="width:${Math.round(done / list.length * 100)}%"></i></span>
                        <span>${done}/${list.length}</span>
                    </div>
                    <div class="album">${list.map(tile).join('')}</div>
                </section>`;
            }).join('')}`;
    }

    const STAR = '<path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/>';
    const $ = (id) => document.getElementById(id);
    const card = $('card'), animalImg = $('animal'), answer = $('answer'), check = $('check');
    const mic = $('mic'), ear = $('ear'), heard = $('heard');

    /* ---------- Konuşma sentezi ---------- */
    const synth = window.speechSynthesis;
    let voices = [];
    const loadVoices = () => { voices = synth ? synth.getVoices() : []; };
    loadVoices();
    if (synth) synth.onvoiceschanged = loadVoices;
    const voiceFor = (lang) => voices.find((v) => v.lang === lang) || voices.find((v) => v.lang && v.lang.startsWith(lang.slice(0, 2)));

    const speak = (text, lang = 'tr-TR', rate = 1) => new Promise((resolve) => {
        if (!synth) return resolve();
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        const v = voiceFor(lang);
        if (v) u.voice = v;
        u.rate = rate;
        u.pitch = lang === 'tr-TR' ? 1.2 : 1.05;
        let done = false;
        const finish = () => { if (!done) { done = true; resolve(); } };
        u.onend = finish;
        u.onerror = finish;
        setTimeout(finish, 6000); // bazı tarayıcılar onend'i kaçırabiliyor
        synth.speak(u);
    });
    /* ---------- Kayıtlı sesler (generate_speech.py ile üretildi) ---------- */
    // Anahtarlar generate_speech.py içindeki TR_LINES ile aynı; dosya çalınamazsa tarayıcı sesi yedek olarak konuşur.
    const TR_LINES = {
        soru: 'Bu hayvanın İngilizcesi ne?',
        'renk-soru': 'Bu renk İngilizce ne?',
        'nesne-soru': 'Bu ne? İngilizcesini söyle!',
        harika: 'Harika!',
        neredeyse: 'Neredeyse! Hadi birlikte söyleyelim.',
        duyamadim: 'Seni duyamadım. Bir daha söyler misin?',
        'bu-bir': 'Bu bir',
        'turkce-soyle': 'İngilizcesini bilmiyorsan, Türkçesini söyle!',
        'tamam-turkcesi': 'Tamam! Türkçesi',
        'ingilizcesi-de': 'İngilizcesi de',
        'sen-de-soyle': 'Hadi şimdi sen de İngilizcesini söyle!',
        'sorun-degil': 'Sorun değil! Birlikte öğrenelim.',
        turkcesi: 'Türkçesi',
        supersin: 'Süpersin! Çok güzel söyledin!',
        aferin: 'Aferin sana! Yine oynayalım mı?',
    };
    let playing = null;
    const playFile = (src) => new Promise((resolve, reject) => {
        if (playing) { playing.pause(); playing = null; }
        synth?.cancel();
        const a = new Audio(src);
        playing = a;
        a.onended = () => { if (playing === a) playing = null; resolve(); };
        a.onerror = () => reject(new Error('ses yüklenemedi'));
        a.play().catch(reject);
    });
    const sayLine = (key) => playFile(`assets/speech/tr/${key}.mp3`).catch(() => speak(TR_LINES[key]));
    const sayWord = (w) => playFile(`assets/speech/en/${w}.mp3`).catch(() => speak(w, 'en-US', 0.85));
    const sayTr = (q) => playFile(`assets/speech/tr/words/${q.word}.mp3`).catch(() => speak(q.tr));

    // "(Tamam!) Türkçesi kedi. İngilizcesi de cat. Hadi şimdi sen de İngilizcesini söyle!"
    const teach = async (q, saidTurkish) => {
        answer.textContent = `${q.tr} → ${q.word}`;
        answer.classList.add('show');
        await sayLine(saidTurkish ? 'tamam-turkcesi' : 'turkcesi');
        await sayTr(q);
        await sayLine('ingilizcesi-de');
        await sayWord(q.word);
        await sayLine('sen-de-soyle');
        answer.classList.remove('show');
    };

    /* ---------- Eşleştirme ---------- */
    const lev = (a, b) => {
        const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
        for (let j = 1; j <= b.length; j++) d[0][j] = j;
        for (let i = 1; i <= a.length; i++) {
            for (let j = 1; j <= b.length; j++) {
                d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
            }
        }
        return d[a.length][b.length];
    };
    const normalize = (s) => s.toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();

    // Bir tanıma sonucu (tüm alternatifler) beklenen hayvanla eşleşiyor mu?
    const matches = (transcripts, animal) => {
        const targets = [animal.word, ...animal.also];
        for (const raw of transcripts) {
            const text = normalize(raw);
            if (!text) continue;
            const words = text.split(' ');
            const candidates = [...words, words.join('')]; // "ele phant" → "elephant"
            for (const c of candidates) {
                for (const t of targets) {
                    if (c === t) return true;
                    // Kısa kelimelerde (cat, dog, bee) tanıyıcı sapmasına izin verme; uzunlarda 1–2 harf hoşgörü
                    if (t.length >= 4 && c.length >= 3) {
                        const tol = t.length >= 7 ? 2 : 1;
                        if (lev(c, t) <= tol) return true;
                    }
                }
            }
        }
        return false;
    };

    // Türkçe eşleştirme: Türkçe harfleri sadeleştir (ç→c, ğ→g, ı→i, ö→o, ş→s, ü→u)
    const foldTr = (x) => x.toLocaleLowerCase('tr-TR')
        .replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u')
        .replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const matchesTr = (transcripts, q) => {
        const targets = q.trAll.map(foldTr);
        for (const raw of transcripts) {
            const words = foldTr(raw).split(' ').filter(Boolean);
            for (const c of [...words, words.join('')]) {
                for (const t of targets) {
                    if (c === t) return true;
                    // "at", "ay", "ev" gibi kısa kelimelerde hoşgörü yok (ay ↔ ayı karışmasın)
                    if (t.length >= 4 && c.length >= 3 && lev(c, t) <= (t.length >= 7 ? 2 : 1)) return true;
                }
            }
        }
        return false;
    };

    // Çocuk "bilmiyorum" mu dedi? (Türkçe ya da İngilizce; en-US tanıyıcı Türkçeyi tuhaf yazabilir:
    // "bill me your um" → "billmeyourum" içinde "billme"/"bilmi" geçer)
    const DUNNO_PARTS = ['bilmiyo', 'bilmiyor', 'bilmem', 'bilemedim', 'bilemiyorum', 'hatirlamiyorum', 'bilmi', 'billme', 'billmi',
        'idontknow', 'dontknow', 'idunno', 'dunno', 'noidea'];
    const isDunno = (transcripts) => transcripts.some((raw) => {
        const joined = foldTr(raw).replace(/\s/g, '').replace(/'/g, '');
        return DUNNO_PARTS.some((p) => joined.includes(p));
    });

    /* ---------- Konuşma tanıma ---------- */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, listening = false;

    // lang: 'en-US' (varsayılan) ya da 'tr-TR'; test: tanınan metinler doğru mu?
    const listen = (lang = 'en-US', test = (all) => matches(all, current())) => new Promise((resolve) => {
        // resolve({ ok: true|false, heard: string, error?: string })
        if (!SR) return resolve({ ok: false, heard: '', error: 'unsupported' });
        rec = new SR();
        rec.lang = lang;
        rec.interimResults = true;
        rec.maxAlternatives = 5;
        rec.continuous = false;

        let settled = false, lastHeard = '';
        const settle = (r) => {
            if (settled) return;
            settled = true;
            listening = false;
            mic.classList.remove('listening');
            try { rec.abort(); } catch (e) {}
            resolve(r);
        };

        rec.onresult = (e) => {
            const all = [];
            for (let i = 0; i < e.results.length; i++) {
                for (let j = 0; j < e.results[i].length; j++) all.push(e.results[i][j].transcript);
            }
            lastHeard = all[0] || lastHeard;
            heard.textContent = lastHeard ? `duyduğum: “${lastHeard.trim()}”` : '';
            if (test(all)) return settle({ ok: true, heard: lastHeard });
            if (isDunno(all)) return settle({ ok: false, dunno: true, heard: lastHeard });
            const isFinal = e.results[e.results.length - 1].isFinal;
            if (isFinal) settle({ ok: false, heard: lastHeard });
        };
        rec.onerror = (e) => settle({ ok: false, heard: lastHeard, error: e.error });
        rec.onend = () => settle({ ok: false, heard: lastHeard, error: lastHeard ? undefined : 'no-speech' });

        listening = true;
        mic.classList.add('listening');
        heard.textContent = '';
        try { rec.start(); } catch (e) { settle({ ok: false, heard: '', error: 'start-failed' }); }
        setTimeout(() => settle({ ok: false, heard: lastHeard, error: lastHeard ? undefined : 'no-speech' }), 7000);
    });

    /* ---------- Oyun ---------- */
    let deck = [], round = 0, tries = 0, score = 0, busy = false, askedTr = false;
    const current = () => deck[round];

    const renderStars = () => {
        $('stars').innerHTML = Array.from({ length: ROUNDS }, (_, i) =>
            `<svg viewBox="0 0 24 24" class="${i < score ? 'on' : ''}" fill="${i < score ? '#FFD966' : '#FCE4EC'}" stroke="${i < score ? '#F0A92E' : '#F3B6CA'}" stroke-width="1.6" stroke-linejoin="round">${STAR}</svg>`
        ).join('');
    };

    const confetti = () => {
        const r = card.getBoundingClientRect();
        const colors = ['#FF8FB1', '#B9A4FF', '#FFD966', '#7FD8B0', '#7CC4FF'];
        for (let i = 0; i < 34; i++) {
            const el = document.createElement('span');
            el.className = 'confetti';
            el.style.left = `${r.left + r.width / 2}px`;
            el.style.top = `${r.top + r.height / 2}px`;
            el.style.background = colors[i % colors.length];
            el.style.setProperty('--dx', `${(Math.random() - 0.5) * 520}px`);
            el.style.setProperty('--dy', `${(Math.random() - 0.75) * 460}px`);
            el.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }
    };

    const animate = (cls) => { card.classList.remove('pop', 'shake'); void card.offsetWidth; card.classList.add(cls); };
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    const showAnimal = async () => {
        const a = current();
        tries = 0;
        askedTr = false;
        renderBoard();
        answer.classList.remove('show');
        check.classList.remove('show');
        heard.textContent = '';
        const blob = $('blob');
        if (a.type === 'color') {
            animalImg.hidden = true;
            blob.hidden = false;
            blob.style.setProperty('--blob', a.hex);
        } else {
            blob.hidden = true;
            animalImg.hidden = false;
            animalImg.src = a.src;
        }
        animate('pop');
        await sayLine(PROMPT[a.type]);
        await attempt();
    };

    const attempt = async () => {
        if (busy) return;
        busy = true;
        mic.classList.add('busy');
        const a = current();
        const r = await listen();
        mic.classList.remove('busy');

        if (r.error === 'not-allowed' || r.error === 'service-not-allowed') {
            busy = false;
            heard.textContent = 'Mikrofon izni verilmedi. Tarayıcının adres çubuğundan izin verin.';
            // Portalda çocuğu bekletme: oyunu atla, çizgi film devam etsin
            if (EMBED) notifyParent({ status: 'skipped', reason: 'mic-denied' });
            return;
        }

        if (r.ok) {
            score++;
            record(a, tries === 0 ? 'firstTry' : 'later');
            runner?.jumpOver(); // sağ panel: engel gelir, koyun atlar
            renderStars();
            check.classList.add('show');
            answer.textContent = a.word;
            answer.classList.add('show');
            animate('pop');
            confetti();
            await sayLine('harika');
            await sayWord(a.word);
            await wait(700);
            busy = false;
            return next();
        }

        tries++;

        // "Bilmiyorum" dedi: üzme, yardım et (yanlış sallanması yok)
        if (r.dunno) {
            recordDunno(a);
            await sayLine('sorun-degil');
            // Türkçesi zaten sorulduysa ikisini birden öğret
            if (askedTr || !a.trAll.length) {
                await teach(a, false);
                busy = false;
                return attempt();
            }
        } else {
            animate('shake');
        }

        // İlk denemede bilemediyse: Türkçesini sor; biliyorsa "Türkçesi şu, İngilizcesi de şu" diyerek yönlendir
        if (!askedTr && tries < MAX_TRIES && a.trAll.length) {
            askedTr = true;
            await sayLine('turkce-soyle');
            const t = await listen('tr-TR', (all) => matchesTr(all, a));
            if (t.ok) {
                recordTr(a);
                await teach(a, true);
                busy = false;
                return attempt();
            }
            if (t.dunno) {
                // Türkçesini de bilmiyor: ikisini birden öğret
                recordDunno(a);
                await sayLine('sorun-degil');
                await teach(a, false);
                busy = false;
                return attempt();
            }
            // Türkçesi de çıkmadı: normal yardım akışı
            await sayLine('neredeyse');
            await sayWord(a.word);
            busy = false;
            return attempt();
        }

        if (r.error === 'no-speech' && !r.heard) {
            await sayLine('duyamadim');
        } else if (tries < MAX_TRIES) {
            await sayLine('neredeyse');
            await sayWord(a.word);
        }

        if (tries >= MAX_TRIES) {
            record(a, 'missed');
            runner?.oops();
            answer.textContent = a.word;
            answer.classList.add('show');
            await sayLine('bu-bir');
            await sayWord(a.word);
            await wait(900);
            busy = false;
            return next();
        }
        busy = false;
        return attempt();
    };

    const next = async () => {
        round++;
        if (round >= ROUNDS) return finish();
        await showAnimal();
    };

    const finish = async () => {
        $('bigStars').innerHTML = Array.from({ length: ROUNDS }, (_, i) =>
            `<svg viewBox="0 0 24 24" style="animation-delay:${i * 0.12}s" fill="${i < score ? '#FFD966' : '#FCE4EC'}" stroke="${i < score ? '#F0A92E' : '#F3B6CA'}" stroke-width="1.4" stroke-linejoin="round">${STAR}</svg>`
        ).join('');
        $('finish').hidden = false;
        confetti();
        await sayLine(score >= Math.ceil(ROUNDS / 2) ? 'supersin' : 'aferin');
        // Geçme şartı yok: 5 soru bitince çizgi film her durumda devam eder; skor sadece bilgi için
        notifyParent({ status: 'success', score, total: ROUNDS });
    };

    const begin = async () => {
        progress = loadProgress();
        progress.game++;
        saveProgress();
        deck = [...choose(ANIMALS, PLAN.animal), ...choose(COLORS, PLAN.color), ...choose(OBJECTS, PLAN.object)]
            .sort(() => Math.random() - 0.5); // seçilenlerin sadece sorulma sırası karışık
        if (!deck.length) deck = choose(ANIMALS, 5);
        ROUNDS = deck.length;
        round = 0; score = 0;
        renderStars();
        $('start').hidden = true;
        $('finish').hidden = true;
        await showAnimal();
    };

    /* ---------- Düğmeler ---------- */
    $('play').addEventListener('click', begin);
    $('again').addEventListener('click', begin);
    mic.addEventListener('click', () => { if (!busy && current()) attempt(); });
    ear.addEventListener('click', () => { if (current() && !listening) sayWord(current().word); });

    if (EMBED) $('again').hidden = true;
    if (MODE_TAM) {
        document.body.classList.add('mode-tam');
        $('board').hidden = false;
        // Sağ panel koşu oyunu: sadece geniş ekranda; Three.js yalnızca burada yüklenir
        if (matchMedia('(min-width: 1100px)').matches) {
            import('./runner.js')
                .then((m) => { runner = m.createRunner($('runner')); })
                .catch(() => { $('runner').remove(); }); // WebGL/modül sorunu: panel olmadan devam
        }
    }
    ROUNDS = PLAN.animal + PLAN.color + PLAN.object || 5;
    renderStars();
    renderBoard();
    if (!SR) {
        $('unsupported').hidden = false;
        $('play').disabled = true;
        $('play').style.opacity = '.4';
        // Portalda konuşma tanıma yoksa oyunu atla
        if (EMBED) notifyParent({ status: 'skipped', reason: 'unsupported' });
    }
})();
</script>
</body>
</html>
