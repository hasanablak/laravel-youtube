<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Renk Kazanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<!--
    Renk Kazanı
    Tüylü canavar Pofuduk düşünce balonunda bir renk ister. Çocuk alttaki renk kavanozlarını kazana
    sürükler ya da dokunur; kazandaki karışım gerçekten o renge döner. Doğruysa Pofuduk iksiri içer ve
    kendi rengi değişir. Önce tek renkler, sonra karışımlar (kırmızı + sarı = turuncu vb.) istenir.
    Okuma gerektirmez: istekler resim ve ses ile.

    - Sesler: assets/speech/*.mp3 (generate_speech.py, ElevenLabs; anahtar ../want-to/.env).
      Dosya çalınamazsa tarayıcı sesi yedek. Efektler (plop, fokur, glup) Web Audio ile üretilir.
    - ?embed=1: portal penceresi. ROUNDS iksirden sonra postMessage({ status: 'success', score }).
-->
<style>
    :root {
        --wall-top: #E9DEFF;
        --wall-bottom: #FFE6F0;
        --floor: #F6D7B0;
        --wood: #C98C58;
        --wood-dark: #9B6339;
        --ink: #3B2F4A;
        --pot: #4B3B63;
        --pot-light: #6A5888;
        --liquid: #8C7BA8;
        --body: #B9E4FF;
        --shadow: rgba(110, 70, 140, .22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
        font-family: 'Fredoka', system-ui, sans-serif; color: var(--ink);
        background: linear-gradient(180deg, var(--wall-top) 0%, var(--wall-bottom) 62%, var(--floor) 62%, #EFC995 100%);
        -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
    }

    /* Duvar süsleri */
    .window { position: absolute; left: 6%; top: 7%; width: min(18vw, 150px); aspect-ratio: 1; border-radius: 50% 50% 14px 14px; background: linear-gradient(180deg, #5C4FA0, #9A7BD6); border: 8px solid #FFFFFF; box-shadow: 0 8px 20px var(--shadow); overflow: hidden; }
    .window i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #FFF4C2; animation: twinkle 2.4s ease-in-out infinite; }
    .window .moon { position: absolute; right: 18%; top: 18%; width: 30%; height: 30%; border-radius: 50%; box-shadow: -8px 4px 0 0 #FFF1A8; }
    .shelf { position: absolute; right: 6%; top: 12%; width: min(22vw, 190px); height: 12px; border-radius: 6px; background: var(--wood); box-shadow: 0 6px 0 var(--wood-dark); }
    .shelf span { position: absolute; bottom: 12px; width: 26px; height: 34px; border-radius: 8px 8px 6px 6px; opacity: .85; }

    .stage { position: relative; height: 100%; display: grid; grid-template-rows: 1fr auto; }
    .scene { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: min(4vw, 40px); padding: 0 16px; min-height: 0; }

    /* Kazan */
    .pot-wrap { position: relative; width: min(42vw, 330px); aspect-ratio: 1.05; margin-bottom: 2vh; }
    .pot-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .bubbles { position: absolute; left: 22%; right: 22%; top: 22%; height: 10px; }
    .bubble { position: absolute; bottom: 0; border-radius: 50%; background: var(--liquid); opacity: .9; animation: rise 1.6s ease-in forwards; box-shadow: inset -2px -3px 0 rgba(0,0,0,.12), inset 2px 2px 0 rgba(255,255,255,.4); }
    .flame { transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; }
    .flame:nth-child(2) { animation-delay: .15s; } .flame:nth-child(3) { animation-delay: .3s; }
    .pot-wrap.splash svg { animation: wobble .45s ease-in-out; }

    /* Pofuduk */
    .monster { position: relative; width: min(30vw, 250px); aspect-ratio: 1; margin-bottom: 2vh; cursor: pointer; }
    .monster svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 14px var(--shadow)); }
    .monster .body-fill { fill: var(--body); transition: fill .8s ease; }
    .monster .part { opacity: 0; transition: opacity .15s; }
    .monster[data-mood="happy"] .m-happy, .monster[data-mood="ask"] .m-ask, .monster[data-mood="yuck"] .m-yuck,
    .monster[data-mood="drink"] .m-drink, .monster[data-mood="wow"] .m-wow { opacity: 1; }
    .monster .eyes { transform-box: fill-box; transform-origin: center; transition: opacity .15s; }
    .monster[data-mood="yuck"] .eyes { opacity: 0; } /* Iyy hâlinde > < gözler görünür */
    .monster.blink .eyes { transform: scaleY(.1); }
    .monster.dance svg { animation: dance .9s ease-in-out 2; }
    .monster.shudder svg { animation: shudder .5s ease-in-out; }
    .monster .pupil { transition: transform .08s linear; }

    .think { position: absolute; left: -46%; top: -42%; width: 62%; aspect-ratio: 1; }
    .think .cloud { position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF; box-shadow: 0 8px 20px var(--shadow); display: flex; align-items: center; justify-content: center; }
    .think .dot1, .think .dot2 { position: absolute; border-radius: 50%; background: #FFFFFF; box-shadow: 0 4px 10px var(--shadow); }
    .think .dot1 { width: 18%; height: 18%; right: -6%; bottom: -8%; } .think .dot2 { width: 11%; height: 11%; right: -18%; bottom: -20%; }
    .think svg { width: 70%; height: 70%; }
    .think.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
    .think .target-liquid { transition: fill .3s; }

    /* Kavanozlar */
    .jars { display: flex; justify-content: center; gap: min(4vw, 30px); padding: 10px 16px max(18px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, rgba(155, 99, 57, .12)); }
    .jar { width: min(19vw, 104px); aspect-ratio: .82; border: 0; background: none; padding: 0; cursor: grab; touch-action: none; transition: transform .2s; }
    .jar svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 8px var(--shadow)); }
    .jar:active { cursor: grabbing; transform: scale(.94); }
    .jar.hint { animation: wiggle .6s ease-in-out 3; }
    .jar:focus-visible { outline: 4px solid #B9A4FF; outline-offset: 4px; border-radius: 20px; }

    .drop { position: fixed; z-index: 30; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; pointer-events: none; box-shadow: inset -6px -8px 0 rgba(0,0,0,.12), inset 6px 6px 0 rgba(255,255,255,.45), 0 8px 16px var(--shadow); }
    .drop.fly { transition: left .45s cubic-bezier(.5, -0.3, .6, 1), top .45s cubic-bezier(.3, -0.6, .7, 1), transform .45s; transform: scale(.5); }

    /* Yıldızlar ve parıltı */
    .score { position: absolute; top: 14px; right: 16px; z-index: 5; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 6px 16px 6px 10px; box-shadow: 0 6px 16px var(--shadow); font-size: 26px; font-weight: 700; }
    .score svg { width: 30px; height: 30px; }
    .score.bump { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
    .spark { position: fixed; z-index: 40; width: 14px; height: 14px; pointer-events: none; animation: spark 1.2s ease-out forwards; }

    .overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: rgba(255, 240, 246, .94); }
    .overlay[hidden] { display: none; }
    .play { width: 150px; height: 150px; border-radius: 50%; border: 0; cursor: pointer; background: linear-gradient(160deg, #C3A6FF, #8E6CF0); box-shadow: 0 14px 34px var(--shadow); display: flex; align-items: center; justify-content: center; animation: breathe 2.2s ease-in-out infinite; }
    .play svg { width: 64px; height: 64px; margin-left: 8px; }
    .play:focus-visible { outline: 4px solid #FF8FB1; outline-offset: 4px; }
    .big-stars { display: flex; gap: 8px; } .big-stars svg { width: 56px; height: 56px; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) both; }

    @keyframes rise { from { transform: translateY(0) scale(.6); opacity: .9 } to { transform: translateY(-70px) scale(1.1); opacity: 0 } }
    @keyframes flicker { from { transform: scaleY(1) } to { transform: scaleY(1.18) translateY(-2px) } }
    @keyframes wobble { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-3deg) } 75% { transform: rotate(3deg) } }
    @keyframes dance { 0%, 100% { transform: translateY(0) rotate(0) } 25% { transform: translateY(-16px) rotate(-6deg) } 50% { transform: translateY(0) } 75% { transform: translateY(-16px) rotate(6deg) } }
    @keyframes shudder { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-10px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(4px) } }
    @keyframes wiggle { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-10deg) scale(1.08) } 75% { transform: rotate(10deg) scale(1.08) } }
    @keyframes pop { 0% { transform: scale(.6) } 60% { transform: scale(1.12) } 100% { transform: scale(1) } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes twinkle { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
    @keyframes spark { from { transform: translate(0, 0) scale(1) rotate(0); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) scale(.3) rotate(260deg); opacity: 0 } }

    @media (max-aspect-ratio: 4/5) {
        .scene { flex-direction: column-reverse; align-items: center; justify-content: flex-end; padding-top: 70px; }
        .monster { width: min(46vw, 230px); margin-bottom: 0; }
        .pot-wrap { width: min(64vw, 300px); }
        .think { left: auto; right: -55%; top: -10%; width: 58%; }
        .think .dot1 { right: auto; left: -6%; } .think .dot2 { right: auto; left: -18%; }
        .window, .shelf { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="window" aria-hidden="true">
    <i style="left:20%;top:30%"></i><i style="left:45%;top:60%;animation-delay:.6s"></i><i style="left:70%;top:72%;animation-delay:1.1s"></i><i style="left:30%;top:78%;animation-delay:.3s"></i>
    <span class="moon"></span>
</div>
<div class="shelf" aria-hidden="true">
    <span style="left:12%;background:#FF8FB1"></span><span style="left:40%;height:26px;background:#9FD4FF"></span><span style="left:68%;background:#C3A6FF"></span>
</div>

<div class="score" id="score" aria-label="Yıldızlar">
    <svg viewBox="0 0 24 24" fill="#FFD966" stroke="#F0A92E" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>
    <span id="scoreNum">0</span>
</div>

<div class="stage">
    <div class="scene">
        <!-- Kazan -->
        <div class="pot-wrap" id="pot" aria-label="Kazan">
            <div class="bubbles" id="bubbles"></div>
            <svg viewBox="0 0 300 286" aria-hidden="true">
                <!-- ateş -->
                <g transform="translate(150 250)">
                    <path class="flame" d="M-60 30 C-70 0 -50 -10 -40 -34 C-34 -10 -20 -4 -22 30z" fill="#FF9A3D"/>
                    <path class="flame" d="M-16 32 C-30 -6 -6 -20 0 -50 C8 -20 30 -6 16 32z" fill="#FFB84D"/>
                    <path class="flame" d="M22 30 C20 -4 34 -10 40 -34 C50 -10 70 0 60 30z" fill="#FF9A3D"/>
                    <path d="M-12 32 C-18 8 -4 0 0 -20 C4 0 18 8 12 32z" fill="#FFE27A"/>
                </g>
                <!-- ayaklar -->
                <rect x="70" y="228" width="22" height="40" rx="8" fill="#3A2D4E"/>
                <rect x="208" y="228" width="22" height="40" rx="8" fill="#3A2D4E"/>
                <!-- gövde -->
                <path d="M34 92 C26 200 80 252 150 252 C220 252 274 200 266 92 Z" fill="var(--pot)"/>
                <path d="M60 120 C60 190 92 226 128 236" stroke="var(--pot-light)" stroke-width="14" stroke-linecap="round" fill="none" opacity=".7"/>
                <!-- karışım -->
                <ellipse cx="150" cy="92" rx="112" ry="26" fill="var(--liquid)" id="liquid" style="transition: fill .6s ease"/>
                <ellipse cx="120" cy="86" rx="36" ry="7" fill="#FFFFFF" opacity=".35"/>
                <!-- ağız kenarı -->
                <ellipse cx="150" cy="92" rx="124" ry="30" fill="none" stroke="#5E4C7A" stroke-width="16"/>
                <ellipse cx="150" cy="88" rx="124" ry="30" fill="none" stroke="#7C68A0" stroke-width="5" opacity=".7"/>
            </svg>
        </div>

        <!-- Pofuduk -->
        <div class="monster" id="monster" data-mood="ask" role="img" aria-label="Pofuduk">
            <div class="think" id="think" aria-hidden="true">
                <div class="dot2"></div><div class="dot1"></div>
                <div class="cloud">
                    <svg viewBox="0 0 100 120">
                        <rect x="38" y="6" width="24" height="16" rx="5" fill="#C98C58"/>
                        <path d="M40 22h20v14c18 6 30 24 30 44 0 22-18 36-40 36S10 102 10 80c0-20 12-38 30-44z" fill="#F4F0FA" stroke="#D9CCEA" stroke-width="3"/>
                        <path class="target-liquid" id="targetLiquid" d="M14 76c10-6 24 4 36 0s26-8 36 0c0 22-16 36-36 36S14 98 14 76z" fill="#FF9433"/>
                        <ellipse cx="36" cy="70" rx="6" ry="12" fill="#FFFFFF" opacity=".55"/>
                        <path d="M78 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FFD966"/>
                    </svg>
                </div>
            </div>
            <svg viewBox="0 0 200 200" aria-hidden="true">
                <!-- boynuzlar -->
                <path d="M62 52 L56 18 L82 44z" fill="#FFD27A"/>
                <path d="M138 52 L144 18 L118 44z" fill="#FFD27A"/>
                <!-- tüylü gövde -->
                <g class="body-fill">
                    <circle cx="100" cy="112" r="72"/>
                    <circle cx="44" cy="96" r="22"/><circle cx="156" cy="96" r="22"/>
                    <circle cx="62" cy="58" r="22"/><circle cx="138" cy="58" r="22"/><circle cx="100" cy="44" r="24"/>
                    <circle cx="36" cy="134" r="20"/><circle cx="164" cy="134" r="20"/>
                </g>
                <ellipse cx="100" cy="140" rx="44" ry="34" fill="#FFFFFF" opacity=".35"/>
                <!-- kollar, ayaklar -->
                <ellipse class="body-fill" cx="30" cy="140" rx="14" ry="20" transform="rotate(25 30 140)"/>
                <ellipse class="body-fill" cx="170" cy="140" rx="14" ry="20" transform="rotate(-25 170 140)"/>
                <ellipse cx="72" cy="186" rx="22" ry="11" fill="#FFFFFF" opacity=".75"/>
                <ellipse cx="128" cy="186" rx="22" ry="11" fill="#FFFFFF" opacity=".75"/>
                <!-- gözler -->
                <g class="eyes">
                    <ellipse cx="76" cy="98" rx="19" ry="21" fill="#FFFFFF"/>
                    <ellipse cx="124" cy="98" rx="19" ry="21" fill="#FFFFFF"/>
                    <g class="pupil"><circle cx="78" cy="100" r="10" fill="#2E2438"/><circle cx="82" cy="95" r="3.5" fill="#FFFFFF"/></g>
                    <g class="pupil"><circle cx="126" cy="100" r="10" fill="#2E2438"/><circle cx="130" cy="95" r="3.5" fill="#FFFFFF"/></g>
                </g>
                <!-- Iyy gözleri (> <) -->
                <g class="part m-yuck" stroke="#2E2438" stroke-width="6" stroke-linecap="round" fill="none">
                    <path d="M64 90l16 9-16 9"/><path d="M136 90l-16 9 16 9"/>
                </g>
                <!-- yanaklar -->
                <ellipse cx="54" cy="124" rx="11" ry="7" fill="#FF8FB1" opacity=".6"/>
                <ellipse cx="146" cy="124" rx="11" ry="7" fill="#FF8FB1" opacity=".6"/>
                <!-- ağızlar -->
                <path class="part m-ask" d="M86 132q14 10 28 0" stroke="#2E2438" stroke-width="5" stroke-linecap="round" fill="none"/>
                <g class="part m-happy"><path d="M78 128h44q0 24-22 24t-22-24z" fill="#E8547A"/><path d="M90 144q10-7 20 0q-10 6-20 0z" fill="#FF9DB8"/></g>
                <ellipse class="part m-wow" cx="100" cy="138" rx="10" ry="12" fill="#2E2438"/>
                <circle class="part m-drink" cx="100" cy="134" r="7" fill="#2E2438"/>
                <g class="part m-yuck"><path d="M80 138q10-10 20 0t20 0" stroke="#2E2438" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M104 140q8 16 0 22q-8-4-4-20z" fill="#FF7FA6"/></g>
            </svg>
        </div>
    </div>

    <div class="jars" id="jars" aria-label="Renk kavanozları"></div>
</div>

<div class="overlay" id="start">
    <button class="play" id="play" type="button" aria-label="Oyunu başlat">
        <svg viewBox="0 0 24 24" fill="#FFFFFF"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>
</div>
<div class="overlay" id="finish" hidden>
    <div class="big-stars" id="bigStars"></div>
</div>

<script>
(() => {
    /* ---------- Renkler ve tarifler ---------- */
    const COLORS = {
        red:    { hex: '#FF4D5E', tr: 'kırmızı' },
        yellow: { hex: '#FFD23F', tr: 'sarı' },
        blue:   { hex: '#3D8BFF', tr: 'mavi' },
        white:  { hex: '#FFFFFF', tr: 'beyaz' },
        orange: { hex: '#FF9433', tr: 'turuncu' },
        green:  { hex: '#3CC46B', tr: 'yeşil' },
        purple: { hex: '#9B5CF6', tr: 'mor' },
        pink:   { hex: '#FF8FC7', tr: 'pembe' },
        sky:    { hex: '#9FD4FF', tr: 'açık mavi' },
    };
    const JARS = ['red', 'yellow', 'blue', 'white'];
    const SINGLES = ['red', 'yellow', 'blue'];
    // İki malzemenin karışımı (alfabetik anahtar)
    const MIX = { 'red+yellow': 'orange', 'blue+yellow': 'green', 'blue+red': 'purple', 'red+white': 'pink', 'blue+white': 'sky' };
    const RECIPE = Object.fromEntries(Object.entries(MIX).map(([k, v]) => [v, k.split('+')]));
    const MUDDY = '#9C8A6B';

    // Kazandaki içeriğin rengi: 1 malzeme → kendisi; 2 → tarif ya da çamur; aynısı iki kez → kendisi
    const mixOf = (items) => {
        if (items.length === 1) return items[0];
        const [a, b] = [...items].sort();
        if (a === b) return a;
        return MIX[`${a}+${b}`] || 'muddy';
    };
    const hexOf = (c) => (c === 'muddy' ? MUDDY : COLORS[c].hex);
    const needed = (target) => (SINGLES.includes(target) ? 1 : 2);

    /* ---------- Ayarlar ---------- */
    const params = new URLSearchParams(location.search);
    const EMBED = params.get('embed') === '1';
    const ROUNDS = 5; // portal penceresinde bu kadar iksirden sonra biter
    const notifyParent = (p) => { if (window.parent && window.parent !== window) window.parent.postMessage(p, '*'); };

    const $ = (id) => document.getElementById(id);
    const monster = $('monster'), pot = $('pot'), liquid = $('liquid'), think = $('think');
    const STAR = '<path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/>';

    /* ---------- Ses: kayıtlar + Web Audio efektleri ---------- */
    const LINES = {
        iste: 'Bana bu renkte bir iksir yapar mısın?', nefis: 'Mmm, nefis! Teşekkür ederim!',
        iyy: 'Iyy! Bu olmadı. Hadi bir daha deneyelim!', ipucu: 'Bak, bu kavanozlar sana yardım edecek!',
        ve: 've', karisinca: 'karışınca', olur: 'olur!', bitti: 'Bugün çok güzel iksirler yaptın! Aferin sana!',
    };
    const synth = window.speechSynthesis;
    const speak = (text) => new Promise((resolve) => {
        if (!synth) return resolve();
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'tr-TR'; u.pitch = 1.25;
        u.onend = u.onerror = () => resolve();
        setTimeout(resolve, 5000);
        synth.speak(u);
    });
    let playing = null;
    const playFile = (src) => new Promise((resolve, reject) => {
        if (playing) playing.pause();
        const a = new Audio(src);
        playing = a;
        a.onended = () => resolve();
        a.onerror = () => reject(new Error('ses yok'));
        a.play().catch(reject);
    });
    const say = (key) => playFile(`assets/speech/${key}.mp3`).catch(() => speak(LINES[key]));
    const sayColor = (c) => playFile(`assets/speech/renk/${c}.mp3`).catch(() => speak(COLORS[c].tr));

    let audio = null;
    const ac = () => (audio ||= new (window.AudioContext || window.webkitAudioContext)());
    const tone = (freq, dur, type = 'sine', vol = .25, slideTo = null, delay = 0) => {
        try {
            const ctx = ac(), t = ctx.currentTime + delay;
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.connect(g).connect(ctx.destination);
            o.start(t); o.stop(t + dur + .02);
        } catch (e) { /* ses yoksa sessiz */ }
    };
    const sfx = {
        plop: () => { tone(620, .18, 'sine', .3, 180); tone(900, .08, 'triangle', .12, 400, .05); },
        bubble: () => tone(300 + Math.random() * 400, .12, 'sine', .08, 900),
        gulp: () => { [0, .22, .44].forEach((d) => tone(220, .16, 'sine', .3, 120, d)); },
        magic: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .25, 'triangle', .14, null, i * .08)); },
        yuck: () => { tone(260, .5, 'sawtooth', .12, 90); },
        pick: () => tone(880, .07, 'triangle', .1, 1200),
    };

    /* ---------- Pofuduk ---------- */
    const setMood = (m) => { monster.dataset.mood = m; };
    const eyesGroup = monster.querySelector('.eyes');
    const pupils = monster.querySelectorAll('.pupil');
    document.addEventListener('pointermove', (e) => {
        const r = monster.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * .45);
        const d = Math.hypot(dx, dy) || 1, k = Math.min(d / 150, 1) * 6;
        pupils.forEach((p) => p.setAttribute('transform', `translate(${(dx / d * k).toFixed(1)} ${(dy / d * k).toFixed(1)})`));
    }, { passive: true });
    const blink = () => {
        monster.classList.add('blink');
        setTimeout(() => monster.classList.remove('blink'), 140);
        setTimeout(blink, 2500 + Math.random() * 3000);
    };
    setTimeout(blink, 2000);
    const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

    /* ---------- Kavanozlar ---------- */
    const jarSvg = (c) => `<svg viewBox="0 0 100 122" aria-hidden="true">
        <rect x="26" y="4" width="48" height="16" rx="6" fill="#C98C58"/><rect x="26" y="14" width="48" height="5" fill="#9B6339"/>
        <path d="M22 22h56v10c10 6 16 16 16 30v42c0 9-7 16-16 16H22c-9 0-16-7-16-16V62c0-14 6-24 16-30z" fill="#F4F0FA" stroke="#D9CCEA" stroke-width="3"/>
        <path d="M10 62c14-8 28 4 40 0s28-8 40 0v40c0 7-5 12-12 12H22c-7 0-12-5-12-12z" fill="${COLORS[c].hex}" ${c === 'white' ? 'stroke="#E6DDF0" stroke-width="2"' : ''}/>
        <ellipse cx="28" cy="78" rx="5" ry="14" fill="#FFFFFF" opacity=".55"/>
        <circle cx="68" cy="94" r="5" fill="#FFFFFF" opacity=".45"/></svg>`;
    const jars = $('jars');
    jars.innerHTML = JARS.map((c) => `<button class="jar" type="button" data-color="${c}" aria-label="${COLORS[c].tr}">${jarSvg(c)}</button>`).join('');

    /* ---------- Oyun durumu ---------- */
    let target = null, contents = [], fails = 0, round = 0, score = 0, busy = true, history = [];

    const bubbleTimer = setInterval(() => {
        if (document.hidden) return;
        const b = document.createElement('span');
        b.className = 'bubble';
        const size = 8 + Math.random() * 16;
        b.style.width = b.style.height = `${size}px`;
        b.style.left = `${Math.random() * 90}%`;
        $('bubbles').appendChild(b);
        setTimeout(() => b.remove(), 1700);
        if (contents.length && Math.random() < .3) sfx.bubble();
    }, 380);

    const setLiquid = (c) => {
        const hex = c ? hexOf(c) : '#8C7BA8';
        liquid.style.fill = hex;
        document.documentElement.style.setProperty('--liquid', hex);
    };

    const pickTarget = () => {
        // İlk 3 tur tek renk; sonra çoğunlukla karışım. Aynı rengi art arda isteme.
        const pool = round < 3 ? SINGLES : (Math.random() < .75 ? Object.keys(RECIPE) : SINGLES);
        const options = pool.filter((c) => c !== history[history.length - 1]);
        return options[Math.floor(Math.random() * options.length)];
    };

    const sparkle = (x, y, n = 20) => {
        const colors = ['#FFD966', '#FF8FB1', '#B9A4FF', '#7FD8B0', '#FFFFFF'];
        for (let i = 0; i < n; i++) {
            const s = document.createElement('span');
            s.className = 'spark';
            s.innerHTML = `<svg viewBox="0 0 24 24" fill="${colors[i % colors.length]}">${STAR}</svg>`;
            s.style.left = `${x}px`; s.style.top = `${y}px`;
            s.style.setProperty('--dx', `${(Math.random() - .5) * 320}px`);
            s.style.setProperty('--dy', `${(Math.random() - .8) * 260}px`);
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1300);
        }
    };

    const newRound = async () => {
        busy = true;
        contents = []; fails = 0;
        setLiquid(null);
        document.querySelectorAll('.jar.hint').forEach((j) => j.classList.remove('hint'));
        target = pickTarget();
        history.push(target);
        $('targetLiquid').setAttribute('fill', COLORS[target].hex);
        replay(think, 'pop');
        setMood('ask');
        await say('iste');
        await sayColor(target);
        busy = false;
    };

    const addIngredient = async (c) => {
        if (busy || !target) return;
        contents.push(c);
        sfx.plop();
        replay(pot, 'splash');
        setLiquid(mixOf(contents));
        if (contents.length < needed(target)) { setMood('wow'); return; }

        busy = true;
        const result = mixOf(contents);
        if (result === target) return success();
        return failure();
    };

    const success = async () => {
        const r = pot.getBoundingClientRect();
        sfx.magic();
        sparkle(r.left + r.width / 2, r.top + r.height * .3);
        await wait(500);
        setMood('drink');
        sfx.gulp();
        setLiquid(null);
        await wait(700);
        monster.style.setProperty('--body', COLORS[target].hex === '#FFFFFF' ? '#F7F3FF' : COLORS[target].hex);
        setMood('happy');
        replay(monster, 'dance');
        const m = monster.getBoundingClientRect();
        sparkle(m.left + m.width / 2, m.top + m.height * .4, 26);
        score++;
        $('scoreNum').textContent = score;
        replay($('score'), 'bump');
        // Karışımsa renkleri öğret: "kırmızı ve sarı karışınca turuncu olur!"
        if (RECIPE[target]) {
            const [a, b] = RECIPE[target];
            await sayColor(a); await say('ve'); await sayColor(b); await say('karisinca'); await sayColor(target); await say('olur');
        }
        await say('nefis');
        round++;
        if (EMBED && round >= ROUNDS) return finish();
        await wait(400);
        newRound();
    };

    const failure = async () => {
        fails++;
        setMood('yuck');
        replay(monster, 'shudder');
        sfx.yuck();
        await say('iyy');
        contents = [];
        setLiquid(null);
        setMood('ask');
        if (fails >= 2) {
            // İpucu: doğru kavanozlar sallanır
            const want = RECIPE[target] || [target];
            want.forEach((c) => replay(document.querySelector(`.jar[data-color="${c}"]`), 'hint'));
            await say('ipucu');
        }
        busy = false;
    };

    const finish = async () => {
        $('bigStars').innerHTML = Array.from({ length: ROUNDS }, (_, i) =>
            `<svg viewBox="0 0 24 24" style="animation-delay:${i * .12}s" fill="#FFD966" stroke="#F0A92E" stroke-width="1.4" stroke-linejoin="round">${STAR}</svg>`).join('');
        $('finish').hidden = false;
        sfx.magic();
        await say('bitti');
        notifyParent({ status: 'success', score });
    };

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    /* ---------- Sürükle-bırak (ve dokun) ---------- */
    let drag = null;
    const overPot = (x, y) => {
        const r = pot.getBoundingClientRect();
        return x > r.left && x < r.right && y > r.top - 40 && y < r.bottom;
    };
    jars.addEventListener('pointerdown', (e) => {
        const jar = e.target.closest('.jar');
        if (!jar || busy) return;
        e.preventDefault();
        sfx.pick();
        const c = jar.dataset.color;
        const el = document.createElement('div');
        el.className = 'drop';
        el.style.background = COLORS[c].hex;
        el.style.left = `${e.clientX}px`; el.style.top = `${e.clientY}px`;
        document.body.appendChild(el);
        drag = { c, el, x0: e.clientX, y0: e.clientY, id: e.pointerId };
        jar.setPointerCapture?.(e.pointerId);
    });
    window.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        drag.el.style.left = `${e.clientX}px`;
        drag.el.style.top = `${e.clientY}px`;
    });
    const release = (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const { c, el, x0, y0 } = drag;
        drag = null;
        const tap = Math.hypot(e.clientX - x0, e.clientY - y0) < 12;
        if (tap || overPot(e.clientX, e.clientY)) {
            // Kazana uçur
            const r = pot.getBoundingClientRect();
            el.classList.add('fly');
            requestAnimationFrame(() => {
                el.style.left = `${r.left + r.width / 2}px`;
                el.style.top = `${r.top + r.height * .32}px`;
            });
            setTimeout(() => { el.remove(); addIngredient(c); }, 460);
        } else {
            el.remove();
        }
    };
    window.addEventListener('pointerup', release);
    window.addEventListener('pointercancel', release);
    // Klavye: Enter/Space ile kavanozu kazana at
    jars.addEventListener('keydown', (e) => {
        const jar = e.target.closest('.jar');
        if (jar && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); addIngredient(jar.dataset.color); }
    });
    monster.addEventListener('click', () => { if (!busy && target) { replay(think, 'pop'); sayColor(target); } });

    $('play').addEventListener('click', () => {
        ac().resume?.();
        $('start').hidden = true;
        newRound();
    });
})();
</script>
</body>
</html>
